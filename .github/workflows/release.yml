# Offspring build + release pipeline.
#
# Triggers:
#   - push to main          -> builds all 3 installers, uploads as workflow artifacts
#   - push of tag vX.Y.Z    -> same builds, then drops everything into a DRAFT release
#   - workflow_dispatch     -> manual button for ad-hoc builds from any ref
#
# Signing is graceful:
#   - MINISIGN_PRIVATE_KEY missing  -> installers ship unsigned, build still succeeds
#   - APPLE_CERTIFICATE missing     -> .dmg ships unsigned + unnotarized, build still succeeds
#   This lets you merge a workflow change and watch it go green before all
#   8 secrets are configured. Fill in secrets as you gather them; the next
#   push starts signing automatically.
#
# Local builds (tools/build-release.ps1, tools/sign-release.ps1) remain the
# source of truth for iteration. CI mirrors those scripts via the -NoBump
# and -Tool rsign flags so the artifacts are byte-identical to what a
# local run on the same commit would produce.

name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # for creating draft releases on tag pushes

jobs:
  # =====================================================================
  # Windows: Standard + Studio in a single job (build-release.ps1 already
  # produces both via the same `npm run tauri build` + a second pass with
  # --features studio).
  # =====================================================================
  windows:
    name: Windows (Standard + Studio)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Every artifact is NAMED from package.json (Offspring-Setup-<v>.exe)
      # but the release is TAGGED from the pushed ref. Nothing checked that
      # those agreed, so pushing v0.5.3 without bumping package.json
      # published a "v0.5.3" release full of files called
      # Offspring-Setup-0.5.2.exe — and the in-app updater compares the tag
      # to the running version, so it would offer an update that installs
      # the same build the user already has. Fail before anything is built.
      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="${{ steps.ver.outputs.version }}"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg_version." \
                 "Bump the version (tools/bump-version.ps1) and re-tag."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches package.json ($pkg_version)."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry + target dirs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            target-studio
            shell-ext/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'shell-ext/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: npm ci
        run: npm ci

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Provision the MSIX signing certificate
        # The shell-extension MSIX packages are signed with a
        # self-signed cert whose public half ships in the installer and
        # is imported into each user's CurrentUser\TrustedPeople store.
        # That only holds together if EVERY release is signed by the
        # SAME certificate.
        #
        # Without this step, build-msix.ps1 finds no .pfx on the runner
        # (.cert/ is gitignored) and quietly generates a brand new
        # self-signed cert per run, using its built-in "offspring-dev"
        # password. Each release then ships a different trust anchor:
        # users accumulate one cert per version in their store, and an
        # in-place package update is signed by a certificate that isn't
        # the one that signed the copy already registered on the machine.
        #
        # MSIX_PFX_B64 is `[Convert]::ToBase64String([IO.File]::ReadAllBytes('offspring-shellext.pfx'))`
        # and MSIX_PFX_PASSWORD_B64 the base64 of the export password —
        # same base64-everything convention as MINISIGN_PRIVATE_KEY
        # above, for the same GitHub-Secrets whitespace reasons.
        shell: pwsh
        env:
          MSIX_PFX_B64: ${{ secrets.MSIX_PFX_B64 }}
          MSIX_PFX_PASSWORD_B64: ${{ secrets.MSIX_PFX_PASSWORD_B64 }}
        run: |
          $isTag = "${{ github.ref }}".StartsWith("refs/tags/v")
          if ([string]::IsNullOrEmpty($env:MSIX_PFX_B64)) {
            if ($isTag) {
              # Hard failure on tag builds only. A release built with a
              # throwaway cert looks fine in testing and misbehaves on
              # real machines months later, so it must never be
              # publishable by accident. Branch builds still go green.
              throw "MSIX_PFX_B64 is not configured. A tagged release must be signed with the pinned shell-extension certificate — see installer/msix/README.md."
            }
            Write-Host "MSIX_PFX_B64 not set - build-msix.ps1 will generate a throwaway dev cert (fine for a branch build)." -ForegroundColor Yellow
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "offspring-shellext.pfx"
          [System.IO.File]::WriteAllBytes(
            $pfxPath, [Convert]::FromBase64String($env:MSIX_PFX_B64)
          )
          # Surfaced to the following steps; the cert never touches the
          # workspace, and RUNNER_TEMP is wiped when the job ends.
          "OFFSPRING_PFX_PATH=$pfxPath" >> $env:GITHUB_ENV
          $pw = [System.Text.Encoding]::UTF8.GetString(
            [Convert]::FromBase64String($env:MSIX_PFX_PASSWORD_B64)
          )
          # Register the DECODED password with the log masker. GitHub
          # only auto-masks the literal secret values it knows about —
          # here that's the base64 form — so the plaintext we derive from
          # it is unmasked, and any later step that happens to echo the
          # environment would print it to a public log in the clear.
          Write-Host "::add-mask::$pw"
          "OFFSPRING_PFX_PASSWORD=$pw" >> $env:GITHUB_ENV
          # Thumbprint only — identifies WHICH cert signed the release
          # without revealing key material, so a mismatch between what
          # users trust and what CI signed is diagnosable from the log.
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 @($pfxPath, $pw)
          Write-Host "MSIX signing cert: $($cert.Subject) thumbprint $($cert.Thumbprint) valid to $($cert.NotAfter)"

      - name: Build Standard + Studio installers
        shell: pwsh
        # -NonInteractive so anything that tries to prompt fails loudly
        # instead of blocking on stdin. A cmdlet waiting for input on a
        # runner is invisible: no output, no error, just a step that
        # runs until the job's six-hour ceiling.
        run: pwsh -NonInteractive -NoProfile tools/build-release.ps1 -NoBump -SkipInstall

      - name: Sign installers (rsign)
        # Graceful degradation on branch builds; hard failure on tags.
        #
        # The in-app updater REQUIRES a `<installer>.exe.minisig` asset:
        # verify_installer_signature fetches the sidecar and refuses the
        # installer outright if it 404s. So publishing a release whose
        # sign step silently skipped doesn't ship an "unsigned but
        # working" update — it ships an update that every existing user
        # downloads and then can't install.
        shell: pwsh
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD_B64: ${{ secrets.MINISIGN_PASSWORD_B64 }}
        run: |
          if ([string]::IsNullOrEmpty($env:MINISIGN_PRIVATE_KEY)) {
            if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
              throw "MINISIGN_PRIVATE_KEY is not configured. A tagged release must ship .minisig sidecars or the in-app updater will reject it for every existing user."
            }
            Write-Host "MINISIGN_PRIVATE_KEY not set - skipping signing." -ForegroundColor Yellow
            exit 0
          }
          # Decode the base64-encoded password into the env var the
          # signing script reads. See the parallel comment on the
          # MINISIGN_PRIVATE_KEY decoding for the rationale — same
          # class of GH-Secrets whitespace bug we're sidestepping.
          $env:MINISIGN_PASSWORD = [System.Text.Encoding]::UTF8.GetString(
              [Convert]::FromBase64String($env:MINISIGN_PASSWORD_B64)
          )
          Write-Host "Installing offspring-sign..." -ForegroundColor Cyan
          cargo install --path tools/offspring-sign --locked --quiet

          $keyPath = Join-Path $env:RUNNER_TEMP "minisign.key"
          # The MINISIGN_PRIVATE_KEY secret is stored as the base64
          # encoding of the .key file's raw bytes (NOT the textual
          # contents). This sidesteps GitHub Secrets' inconsistent
          # multi-line handling entirely — base64 is a single ASCII
          # line, so paste-time CR insertion, whitespace collapsing,
          # and "newlines turning into spaces" all become impossible.
          # We FromBase64String → WriteAllBytes to get a file that's
          # byte-identical to the local .key file.
          $keyBytes = [Convert]::FromBase64String($env:MINISIGN_PRIVATE_KEY)
          [System.IO.File]::WriteAllBytes($keyPath, $keyBytes)

          # Diagnostic — see the parallel comment in the Mac sign step.
          # None of these leak private key material; they let us
          # confirm the bytes that landed on the runner match the
          # bytes on your PC.
          Write-Host "--- key diagnostics ---"
          $info = Get-Item $keyPath
          Write-Host "size: $($info.Length) bytes"
          $firstLine = Get-Content $keyPath -TotalCount 1
          Write-Host "header: $firstLine"
          $hash = (Get-FileHash $keyPath -Algorithm SHA256).Hash.ToLower()
          Write-Host "sha256: $hash"
          $lc = (Get-Content $keyPath | Measure-Object -Line).Lines
          Write-Host "line count: $lc"
          Write-Host "-----------------------"

          $version = "${{ steps.ver.outputs.version }}"
          $standard = "installer\dist\Offspring-Setup-$version.exe"
          $studio   = "installer\dist\Offspring-Studio-Setup-$version.exe"

          try {
            # Call in-process with `&`, NOT `pwsh tools/...`. Spawning a
            # child pwsh flattens the `@($standard, $studio)` array into
            # separate argv tokens: the child binds -Files to ONLY the
            # first element and the second silently lands on the positional
            # -InstallerPath, which the -Files branch then ignores — so the
            # studio installer never got signed. An in-process `&` call
            # passes the array as a real [string[]], signing both.
            & ./tools/sign-release.ps1 -Tool offspring-sign -KeyPath $keyPath -Files @($standard, $studio)
          } finally {
            Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows artifacts
        # always() so we still get the unsigned installers out when the
        # sign step fails — without this, a sign failure on the line
        # above means no .exe ever lands on the run page, and we lose
        # the ability to install and smoke-test the build manually
        # while debugging the signing path.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          if-no-files-found: error
          retention-days: 90
          path: |
            installer/dist/Offspring-Setup-*.exe
            installer/dist/Offspring-Setup-*.exe.minisig
            installer/dist/Offspring-Studio-Setup-*.exe
            installer/dist/Offspring-Studio-Setup-*.exe.minisig

  # =====================================================================
  # macOS: universal binary (arm64 + x86_64), signed + notarized via
  # Tauri's built-in pipeline. Tauri picks up the APPLE_* env vars and
  # handles cert import, codesign, notarytool submit, and stapling.
  # =====================================================================
  macos:
    name: macOS (universal)
    runs-on: macos-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain (both Apple targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo registry + target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: npm ci
        run: npm ci

      - name: Build universal .dmg (signed + notarized when secrets set)
        env:
          # Tauri auto-detects these and handles cert import + codesign +
          # notarization end-to-end. When any of them is empty, Tauri
          # skips the signing/notarization steps and produces an
          # unsigned .dmg (gatekeeper warning on first launch but
          # otherwise functional for iteration).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tauri needs a temp keychain password when importing the cert.
          # Any non-empty value works; runner discards the keychain after
          # the job ends.
          CI_KEYCHAIN_PWD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          npm run tauri build -- \
            --config src-tauri/tauri.macos.conf.json \
            --target universal-apple-darwin

      - name: Locate built .dmg
        id: dmg
        run: |
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n1)
          if [ -z "$dmg" ]; then
            echo "No .dmg produced — check the tauri build step." >&2
            exit 1
          fi
          echo "path=$dmg" >> "$GITHUB_OUTPUT"
          echo "Built: $dmg"

      - name: Sign .dmg (rsign)
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD_B64: ${{ secrets.MINISIGN_PASSWORD_B64 }}
          DMG_PATH: ${{ steps.dmg.outputs.path }}
        run: |
          if [ -z "$MINISIGN_PRIVATE_KEY" ]; then
            echo "MINISIGN_PRIVATE_KEY not set - skipping signing."
            exit 0
          fi
          # Decode the base64-encoded password. See parallel comment
          # in the Windows sign step for the rationale.
          export MINISIGN_PASSWORD=$(printf '%s' "$MINISIGN_PASSWORD_B64" | base64 -d)
          echo "Installing offspring-sign..."
          cargo install --path tools/offspring-sign --locked --quiet

          key_path="$RUNNER_TEMP/minisign.key"
          # MINISIGN_PRIVATE_KEY is base64 of the .key file's raw bytes.
          # See the parallel comment on the Windows sign step.
          printf '%s' "$MINISIGN_PRIVATE_KEY" | base64 -d > "$key_path"
          chmod 600 "$key_path"

          # Diagnostic block — log the size, header line, and a sha256
          # of the key file as written. None of these leak the private
          # key material, but they let us compare what landed in CI
          # against the local file byte-for-byte. Compare with:
          #   (Get-FileHash installer\.minisign\offspring.key -Algorithm SHA256).Hash.ToLower()
          # on your PC.
          echo "--- key diagnostics ---"
          echo "size: $(wc -c < "$key_path") bytes"
          echo "header: $(head -n1 "$key_path")"
          echo "sha256: $(shasum -a 256 "$key_path" | awk '{print $1}')"
          echo "line count: $(wc -l < "$key_path")"
          echo "-----------------------"

          # macos-latest ships pwsh — same script as Windows uses.
          # PowerShell auto-promotes a single string to a one-element
          # array for [string[]] params, so we pass $DMG_PATH directly
          # without the @(...) wrapper that bash would try to parse as
          # a subshell.
          pwsh tools/sign-release.ps1 -Tool offspring-sign -KeyPath "$key_path" -Files "$DMG_PATH"

          rm -f "$key_path"

      - name: Upload macOS artifacts
        # always() — see comment on the Windows upload step.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          if-no-files-found: error
          retention-days: 90
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg.minisig

  # =====================================================================
  # Draft release: only runs on tag pushes. Collects all 6 assets and
  # creates a draft you publish manually after smoke-testing the artifacts.
  # =====================================================================
  release:
    name: Draft release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: dist/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: dist/

      - name: List assets
        run: ls -la dist/

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Offspring ${{ needs.windows.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
